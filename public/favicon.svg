<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="optivaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <!-- Rounded squircle background -->
  <rect width="512" height="512" rx="128" fill="url(#optivaGrad)" />
  
  <!-- Inner optical rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.15" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#34d399" stroke-width="16" opacity="0.25" stroke-dasharray="16 12" />

  <!-- Speed Lightning Bolt / Optical Wave -->
  <path d="M280 80 L160 270 L250 270 L230 432 L360 240 L270 240 Z" fill="url(#emeraldGrad)" />
  
  <!-- Core spark -->
  <circle cx="260" cy="255" r="16" fill="#ffffff" />
</svg>
